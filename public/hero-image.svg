<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#grad1)" width="1200" height="1200"/>
  
  <!-- Building illustration -->
  <rect x="350" y="300" width="500" height="600" fill="#3b82f6" opacity="0.3"/>
  <rect x="370" y="320" width="460" height="560" fill="white" opacity="0.1"/>
  
  <!-- Windows -->
  <g opacity="0.3">
    <rect x="400" y="350" width="80" height="80" fill="white"/>
    <rect x="520" y="350" width="80" height="80" fill="white"/>
    <rect x="640" y="350" width="80" height="80" fill="white"/>
    
    <rect x="400" y="470" width="80" height="80" fill="white"/>
    <rect x="520" y="470" width="80" height="80" fill="white"/>
    <rect x="640" y="470" width="80" height="80" fill="white"/>
    
    <rect x="400" y="590" width="80" height="80" fill="white"/>
    <rect x="520" y="590" width="80" height="80" fill="white"/>
    <rect x="640" y="590" width="80" height="80" fill="white"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="950" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="white">
    Piso Calle Cuenca 13
  </text>
  <text x="600" y="1030" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" fill="#dbeafe">
    Arrancapins, Valencia
  </text>
  
  <!-- Icon -->
  <text x="600" y="200" font-size="120" dominant-baseline="middle" text-anchor="middle">🏠</text>
</svg>

